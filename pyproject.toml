[project]
name = "iqradar"
version = "0.1.0"
description = "Local LLM IQ radar benchmark pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.0",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "typer>=0.12",
  "openpyxl>=3.1",
]

[project.scripts]
iqradar = "iqradar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iqradar"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
]
bench = [
  "terminal-bench==0.2.18",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
